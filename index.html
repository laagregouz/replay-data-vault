<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Invite de commandes</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cascadia+Code&family=Consolas&display=swap');

  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: #1e1e1e;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Cascadia Code', Consolas, monospace;
  }

  .cmd-window {
    width: min(880px, 96vw);
    background: #0c0c0c;
    border: 1px solid #333;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  }

  .cmd-titlebar {
    background: #1e1e1e;
    color: #ccc;
    font-size: 12px;
    padding: 6px 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #2d2d2d;
    user-select: none;
  }
  .cmd-titlebar .label { display: flex; align-items: center; gap: 6px; }
  .cmd-titlebar .icon { width: 14px; height: 14px; background: #0c0c0c; border: 1px solid #555; display: inline-block; }
  .cmd-titlebar .win-btns { display: flex; gap: 2px; }
  .cmd-titlebar .win-btns span {
    width: 28px; height: 20px; display: flex; align-items: center; justify-content: center;
    font-size: 12px; color: #ccc;
  }
  .cmd-titlebar .win-btns span.close:hover { background: #e81123; color: #fff; }
  .cmd-titlebar .win-btns span:not(.close):hover { background: #333; }

  .cmd-body {
    padding: 10px 12px 16px;
    color: #cccccc;
    font-size: 15px;
    line-height: 1.5;
    height: 420px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .cmd-body .err { color: #ff6b6b; }
  .cmd-body .ok { color: #6bff95; }

  .prompt-line { display: flex; }
  .prompt-line .prefix { white-space: pre; }
  .typed { white-space: pre; }
  .cursor {
    display: inline-block; width: 8px; height: 16px;
    background: #cccccc; margin-left: 1px;
    animation: blink 1s steps(1) infinite;
    vertical-align: text-bottom;
  }
  @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }

  #hiddenInput {
    position: absolute; opacity: 0; pointer-events: none; width: 1px; height: 1px;
  }
</style>
</head>
<body>

<div class="cmd-window" id="cmdWindow">
  <div class="cmd-titlebar">
    <div class="label"><span class="icon"></span> Invite de commandes</div>
    <div class="win-btns"><span>—</span><span>▢</span><span class="close">✕</span></div>
  </div>
  <div class="cmd-body" id="cmdBody"></div>
</div>

<input id="hiddenInput" autocomplete="off" autocapitalize="off" spellcheck="false">

<script>
const body = document.getElementById("cmdBody");
const hiddenInput = document.getElementById("hiddenInput");
const PROMPT = "C:\\USERS\\GUEST>";
const VALID_COMMANDS = ["replaycore", "replay-core", "replay core", "start replaycore"];

let currentLine = null;
let typed = "";
let locked = false;

function println(text, cls) {
  const div = document.createElement("div");
  if (cls) div.className = cls;
  div.textContent = text;
  body.appendChild(div);
  body.scrollTop = body.scrollHeight;
}

function newPromptLine() {
  typed = "";
  const div = document.createElement("div");
  div.className = "prompt-line";
  div.innerHTML = `<span class="prefix">${PROMPT}</span><span class="typed"></span><span class="cursor"></span>`;
  body.appendChild(div);
  currentLine = div.querySelector(".typed");
  body.scrollTop = body.scrollHeight;
}

function bootSequence() {
  const lines = [
    "Microsoft Windows [Version 10.0.19045.3803]",
    "(c) Microsoft Corporation. Tous droits réservés.",
    ""
  ];
  lines.forEach(l => println(l));
  newPromptLine();
}

async function runCommand(cmd) {
  const clean = cmd.trim().toLowerCase();

  if (VALID_COMMANDS.includes(clean)) {
    locked = true;
    println("");
    const steps = [
      "Initialisation de REPLAY CORE...",
      "Connexion au noyau d'archivage...",
      "Vérification des accès...",
      "Accès autorisé."
    ];
    for (const s of steps) {
      await new Promise(r => setTimeout(r, 450));
      println(s, "ok");
    }
    await new Promise(r => setTimeout(r, 500));
    window.location.href = "login.html";
    return;
  }

  if (clean === "cls" || clean === "clear") {
    body.innerHTML = "";
    newPromptLine();
    return;
  }

  if (clean === "") {
    newPromptLine();
    return;
  }

  println(`'${cmd}' n'est pas reconnu en tant que commande interne`, "err");
  println("ou externe, un programme exécutable ou un fichier de commandes.", "err");
  println("");
  newPromptLine();
}

document.addEventListener("click", () => hiddenInput.focus());
hiddenInput.focus();

hiddenInput.addEventListener("keydown", (e) => {
  if (locked) return;
  if (e.key === "Enter") {
    const cmd = typed;
    currentLine.parentElement.querySelector(".cursor").remove();
    runCommand(cmd);
  } else if (e.key === "Backspace") {
    typed = typed.slice(0, -1);
    currentLine.textContent = typed;
  } else if (e.key.length === 1) {
    typed += e.key;
    currentLine.textContent = typed;
  }
});

bootSequence();
</script>
</body>
</html>
